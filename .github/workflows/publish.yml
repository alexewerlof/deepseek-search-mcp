# Builds the image on every push and publishes it to GitHub Container Registry,
# so a remote machine can pull a build instead of building one.
# Nothing secret is passed to the build: the image is deliberately
# config-free, and configuration arrives at run time from the host.
#
# Tags published:
#   sha-<7>       every push, immutable; this is the identity of a build
#   latest        pushes to main only; a moving alias for the newest main build
#   1.2.3 / 1.2   pushes of a `v1.2.3` tag
name: publish

on:
    push:
        branches: ['**']
        tags: ['v*.*.*']
    pull_request:
    workflow_dispatch:

# A superseded pull request build is pointless, but every push to main must
# publish: cancelling one would leave a commit without an image.
concurrency:
    group: publish-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `GITHUB_TOKEN` is the only credential this workflow uses. Pushing to GHCR for a
# repository it already has access to needs no separate registry secret.
permissions:
    contents: read
    packages: write

env:
    IMAGE: ghcr.io/${{ github.repository }}

jobs:
    verify:
        name: Verify
        # Pinned rather than `ubuntu-latest`: that label moves from Ubuntu 24.04
        # to 26.04 over October–November 2026, which would swap the build OS
        # under a running workflow. Bumping the pin is a deliberate change.
        runs-on: ubuntu-24.04
        steps:
            # `checkout@v5` and newer run on Node 24; older majors still ask for
            # Node 20, which the runners no longer provide.
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run fmt:check
            - run: npm run lint
            - run: npm run typecheck
            # Offline and free: no DeepSeek key is needed, so a fork PR can run it.
            - run: npm run test:unit

    image:
        name: Build image
        needs: verify
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v5

            - uses: docker/setup-buildx-action@v4

            - name: Derive tags and labels
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.IMAGE }}
                  tags: |
                      type=sha,format=short,prefix=sha-
                      type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}

            # A pull request builds and loads nothing, but it still proves the
            # Dockerfile works. Forks never reach the registry: their token is
            # read-only and the login step is skipped.
            - name: Log in to GHCR
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  # Record what went into the image; the image itself must never
                  # contain a credential.
                  sbom: true
                  provenance: mode=max
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            # Guards the invariant the Dockerfile is written around: no `.env` and
            # no credential inside the published image.
            - name: Check the image carries no credentials
              if: github.event_name != 'pull_request'
              run: |
                  image="${IMAGE}:sha-${GITHUB_SHA:0:7}"
                  docker pull "$image"
                  if docker run --rm --entrypoint sh "$image" -c 'ls -a /app' | grep -q '^\.env'; then
                      echo "The image contains a .env file." >&2
                      exit 1
                  fi
                  leaked="$(docker run --rm "$image" env | grep -E '^(DEEPSEEK_API_KEY|MCP_AUTH_TOKEN)=' || true)"
                  if [ -n "$leaked" ]; then
                      echo "The image has credentials in its environment." >&2
                      exit 1
                  fi
